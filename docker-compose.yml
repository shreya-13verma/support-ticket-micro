services:
  user_db:
    image: postgres:16-alpine
    container_name: ticket_user_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: user_password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user_service:
    build:
      context: ./user_service
      dockerfile: Dockerfile
    container_name: ticket_user_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://user_admin:user_password@user_db:5432/user_db
      SECRET_KEY: supersecretjwtkeyforbothservices12345
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      INTERNAL_API_KEY: internal_service_secret_token_xyz987
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    depends_on:
      user_db:
        condition: service_healthy

  assign_db:
    image: postgres:16-alpine
    container_name: ticket_assign_db
    restart: always
    environment:
      POSTGRES_USER: assign_admin
      POSTGRES_PASSWORD: assign_password
      POSTGRES_DB: assign_db
    ports:
      - "5433:5432"
    volumes:
      - assign_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assign_admin -d assign_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  assign_service:
    build:
      context: ./assign_service
      dockerfile: Dockerfile
    container_name: ticket_assign_service
    restart: always
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://assign_admin:assign_password@assign_db:5432/assign_db
      SECRET_KEY: supersecretjwtkeyforbothservices12345
      ALGORITHM: HS256
      INTERNAL_API_KEY: internal_service_secret_token_xyz987
      USER_SERVICE_URL: http://user_service:8001
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    volumes:
      - assign_uploads:/app/uploads
    depends_on:
      assign_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      user_service:
        condition: service_started

  assign_worker:
    build:
      context: ./assign_service
      dockerfile: Dockerfile
    container_name: ticket_assign_worker
    restart: always
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://assign_admin:assign_password@assign_db:5432/assign_db
      SECRET_KEY: supersecretjwtkeyforbothservices12345
      ALGORITHM: HS256
      INTERNAL_API_KEY: internal_service_secret_token_xyz987
      USER_SERVICE_URL: http://user_service:8001
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - assign_uploads:/app/uploads
    depends_on:
      assign_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  assign_beat:
    build:
      context: ./assign_service
      dockerfile: Dockerfile
    container_name: ticket_assign_beat
    restart: always
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://assign_admin:assign_password@assign_db:5432/assign_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      VITE_USER_API_URL: http://localhost:8001/api/v1
      VITE_ASSIGN_API_URL: http://localhost:8002/api/v1
      VITE_WS_URL: ws://localhost:8002/ws
    depends_on:
      - user_service
      - assign_service

volumes:
  user_db_data:
  assign_db_data:
  assign_uploads:
